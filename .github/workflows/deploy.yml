name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Runs at the same time as the image build. The deploy waits for both, so a build that would show visitors a blank page, or
  # legal pages with details missing, never reaches Render even though its image has already been pushed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Legal pages are complete and up to date
        run: python3 scripts/build-legal.py --check --strict

      # A web build can pass every test and still show visitors a blank page (outage of 9 Oct 2026). Build the pages here and
      # fail the deploy if the files import each other in a loop or the shared code is not where the chunk rules put it.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Web build has no import loops
        run: |
          npm ci
          npm run build
          python3 scripts/check-bundle.py dist

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      render-image: ${{ steps.ref.outputs.render_image }}
    steps:
      - uses: actions/checkout@v6

      # Docker Hub limits anonymous downloads per IP address, and GitHub's runners share addresses, so builds failed with
      # "429 Too Many Requests" or timed out (9 Oct 2026). Both the builder itself and the base images (golang, node, alpine,
      # litestream) are fetched through Google's public mirror of Docker Hub instead; an image the mirror lacks still comes
      # from Docker Hub, as before.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up variables
        id: ref
        run: |
          echo "image=${IMAGE,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "render_image=${IMAGE,,}-render" >> "$GITHUB_OUTPUT"
          echo "build_unix_time=$(date '+%s')" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.image }}
          # BUILD_PIPELINE, CHECK_3RD_API and SKIP_TESTS used to be defaults written into the Dockerfile; they are passed
          # here instead so the Dockerfile stays exactly upstream's and merges cleanly
          build-args: |
            RELEASE_BUILD=1
            BUILD_PIPELINE=1
            CHECK_3RD_API=0
            SKIP_TESTS=1
            BUILD_UNIXTIME=${{ steps.ref.outputs.build_unix_time }}
            BUILD_DATE=${{ steps.ref.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Litestream image for Render
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/render/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_IMAGE=${{ steps.ref.outputs.image }}
          tags: |
            ${{ steps.ref.outputs.render_image }}:${{ github.sha }}
            ${{ steps.ref.outputs.render_image }}:latest

  deploy:
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ${{ needs.build.outputs.render-image }}:${{ github.sha }}
        run: |
          case "$RENDER_DEPLOY_HOOK_URL" in
            https://api.render.com/deploy/*) ;;
            *) echo "::error::RENDER_DEPLOY_HOOK_URL is missing or not a Render deploy hook URL (expected https://api.render.com/deploy/srv-...?key=...)"; exit 1 ;;
          esac
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["IMAGE_URL"],safe=""))')"
