name: Ext CI

# Guards the extension module: tests, and that upstream files stay untouched except for the registered seams.
on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  ext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      # Compared with upstream rather than our own main: that finds every upstream file this fork changes, including drift
      # that is already on main, and an upstream merge (which changes many upstream files) passes as it should
      - name: Seam check against upstream
        run: |
          git remote add upstream https://github.com/mayswind/ezbookkeeping.git
          git fetch --no-tags upstream main
          scripts/check-seams.sh upstream/main

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Frontend checks
        run: |
          npm ci
          npx vue-tsc --noEmit
          npx vitest run src/ext
          npm run build
          python3 scripts/check-bundle.py dist

      - name: Legal pages
        run: python3 -m unittest scripts/test_build_legal.py && python3 scripts/build-legal.py --check

      - name: Ext tests
        run: go test ./pkg/ext/...
